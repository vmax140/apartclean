packages:
  - apps/*
  - packages/*

# pnpm 10+ ne pokreće install skripte dok se paket ne navede ovde.
minimumReleaseAgeExclude:
  - '@expo/image-utils@0.12.7'
  - '@expo/require-utils@58.0.6'
  - expo-location@58.0.21
  - '@expo/env@2.6.0'
  - expo-constants@58.0.16
  - expo-notifications@58.1.9

onlyBuiltDependencies:
  - esbuild
  - sharp
  - supabase
  - unrs-resolver
